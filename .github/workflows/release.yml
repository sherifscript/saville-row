name: Release

on:
  push:
    branches: [main]
    paths: ['.claude-plugin/plugin.json']

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: echo "version=$(jq -r .version .claude-plugin/plugin.json)" >> "$GITHUB_OUTPUT"

      - name: Verify version sync
        run: python scripts/bump_version.py "${{ steps.version.outputs.version }}" --check

      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          # Release notes: the CHANGELOG section for this version.
          awk -v ver="$VERSION" '
            $0 ~ "^## v" ver " " { on=1; next }
            on && /^## v/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md
